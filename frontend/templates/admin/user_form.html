{% extends "layout.html" %}
{% block title %}{{ "Edit " ~ user.name if user else "Add user" }}{% endblock %}

{% block content %}
{% set v = form or user or {} %}
<div class="card form-card">
  <form method="post" class="form-grid">
    <label class="field">
      <span>Full name</span>
      <input name="name" value="{{ v.name or '' }}" required autofocus />
    </label>
    <label class="field">
      <span>Role</span>
      <select name="role">
        {% for r in ["doctor", "nurse", "admin"] %}
        <option value="{{ r }}" {{ 'selected' if (v.role or 'doctor') == r }}>{{ r|capitalize }}</option>
        {% endfor %}
      </select>
    </label>
    <label class="field">
      <span>Email</span>
      <input type="email" name="email" value="{{ v.email or '' }}" required />
    </label>
    <label class="field">
      <span>{{ "New password (leave blank to keep)" if user else "Password" }}</span>
      <input type="password" name="password" minlength="6" {{ '' if user else 'required' }} />
    </label>
    <label class="field">
      <span>Department</span>
      <input name="department" value="{{ v.department or '' }}" />
    </label>
    <label class="field">
      <span>Phone</span>
      <input name="phone" value="{{ v.phone or '' }}" />
    </label>
    <div class="form-actions span-2">
      <a class="btn btn-ghost" href="{{ url_for('admin.users') }}">Cancel</a>
      <button class="btn btn-primary">Save</button>
    </div>
  </form>
</div>
{% endblock %}
