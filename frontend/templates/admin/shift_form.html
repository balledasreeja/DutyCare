{% extends "layout.html" %}
{% block title %}{{ "Edit shift" if shift else "Add shift" }}{% endblock %}

{% block content %}
{% set v = form or shift or {} %}
<div class="card form-card">
  <form method="post" class="form-grid">
    <label class="field">
      <span>Date</span>
      <input type="date" name="date" value="{{ v.date or today }}" required />
    </label>
    <label class="field">
      <span>Period</span>
      <select name="period">
        {% for p in periods %}<option {{ 'selected' if v.period == p }}>{{ p }}</option>{% endfor %}
      </select>
    </label>
    <label class="field span-2">
      <span>Ward</span>
      <input name="ward" value="{{ v.ward or 'General' }}" required />
    </label>
    <label class="field">
      <span>Doctors needed</span>
      <input type="number" name="doctors_needed" min="0" max="20" value="{{ v.doctors_needed if v.doctors_needed is defined else 1 }}" />
    </label>
    <label class="field">
      <span>Nurses needed</span>
      <input type="number" name="nurses_needed" min="0" max="20" value="{{ v.nurses_needed if v.nurses_needed is defined else 0 }}" />
    </label>
    <div class="form-actions span-2">
      <a class="btn btn-ghost" href="{{ url_for('admin.shifts') }}">Cancel</a>
      <button class="btn btn-primary">Save</button>
    </div>
  </form>
</div>
{% endblock %}
